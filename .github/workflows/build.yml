name: Build MCreator Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download and set up MCreator
      run: |
        wget https://github.com/MCreator/MCreator/releases/download/2023.4/MCreator.2023.4.Linux.64bit.zip
        unzip MCreator.2023.4.Linux.64bit.zip
        chmod +x mcreator/mcreator

    - name: Download Gemini API Library
      run: |
        mkdir -p mcreator/userlibs
        wget -P mcreator/userlibs https://repo1.maven.org/maven2/com/google/cloud/google-cloud-aiplatform/2.8.0/google-cloud-aiplatform-2.8.0.jar

    - name: Build the mod
      run: |
        mcreator/mcreator --headless build --recompile
